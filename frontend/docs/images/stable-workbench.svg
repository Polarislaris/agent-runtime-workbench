    <path d="M42 66V50a20 20 0 0 1 20-20h1316a20 20 0 0 1 20 20v16z" fill="#101827"/>
    <circle cx="70" cy="57" r="6" fill="#fb7185"/>
    <circle cx="90" cy="57" r="6" fill="#fbbf24"/>
    <circle cx="110" cy="57" r="6" fill="#34d399"/>
    <text x="720" y="63" text-anchor="middle" class="muted">Agent Runtime Workbench · Stable Portfolio Edition</text>
    <rect x="1234" y="43" width="136" height="28" rx="14" fill="#052e2b" stroke="#065f46"/>
    <circle cx="1252" cy="57" r="4" fill="#34d399"/>
    <text x="1264" y="61" font-size="11" fill="#6ee7b7">Live · recovered</text>

    <!-- Three columns -->
    <rect x="42" y="84" width="258" height="784" fill="#0c1322"/>
    <rect x="300" y="84" width="710" height="784" fill="#090f1c"/>
    <rect x="1010" y="84" width="388" height="784" fill="#0c1322"/>
