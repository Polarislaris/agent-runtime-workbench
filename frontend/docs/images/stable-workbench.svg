      <path d="M11 25l8-14 8 14M14 21h10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="16" class="title">Agent Studio</text>
      <text x="50" y="35" class="small">demo-app · local</text>

      <rect y="60" width="210" height="40" rx="10" fill="#2563eb"/>
