      <rect y="754" width="340" height="42" rx="9" fill="#151229" stroke="#4c1d95"/>
      <rect x="12" y="764" width="74" height="22" rx="11" fill="#312e81"/>
      <text x="49" y="779" text-anchor="middle" font-size="10" fill="#c4b5fd">Mock MCP</text>
