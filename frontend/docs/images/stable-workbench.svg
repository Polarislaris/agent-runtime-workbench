      <rect x="496" y="493" width="104" height="28" rx="8" fill="#6d28d9"/>
      <text x="548" y="512" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Open diff</text>

      <!-- Final response -->
      <text x="46" y="558" class="body">修复完成：session 状态已改为请求级隔离，相关测试全部通过。</text>
      <rect x="46" y="578" width="576" height="50" rx="10" fill="#052e2b" stroke="#065f46"/>
      <circle cx="68" cy="603" r="8" fill="#10b981"/>
      <path d="M64 603l3 3 6-8" fill="none" stroke="#fff" stroke-width="1.8"/>
      <text x="86" y="599" class="body">Run completed successfully</text>
      <text x="86" y="617" class="small">12 tools · 3 tasks · 8 tests passed</text>
