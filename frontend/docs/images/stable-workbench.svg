      <circle cx="16" cy="374" r="4" fill="#f87171"/>
      <text x="30" y="379" class="body">Run full regression</text>
      <text x="30" y="399" class="small">Failed · 48s</text>
      <text x="190" y="399" text-anchor="end" class="small">1h</text>

      <rect y="428" width="210" height="70" rx="11" fill="#111827"/>
      <circle cx="16" cy="452" r="4" fill="#64748b"/>
      <text x="30" y="457" class="body">Explore mock MCP</text>
      <text x="30" y="477" class="small">Cancelled · 22s</text>
      <text x="190" y="477" text-anchor="end" class="small">2h</text>

      <text y="548" class="label">WORKSPACE</text>
