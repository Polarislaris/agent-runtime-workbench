    <text x="344" y="836" class="muted">This run is complete. Start a new run to continue.</text>
    <rect x="879" y="818" width="91" height="26" rx="8" fill="#2563eb"/>
    <text x="924" y="835" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">New run</text>

