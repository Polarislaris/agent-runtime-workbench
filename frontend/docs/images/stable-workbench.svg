<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent Runtime Workbench 稳定版三栏界面</title>
  <desc id="desc">稳定版增加持久化运行记录、任务和 Agent tabs、worktree review 以及断线恢复状态。</desc>
  <defs>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="topGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <style>
      .font { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: 1.25px; fill: #64748b; }
      .small { font-size: 11px; fill: #94a3b8; }
      .muted { font-size: 13px; fill: #94a3b8; }
      .body { font-size: 13px; fill: #dbeafe; }
      .title { font-size: 16px; font-weight: 700; fill: #f8fafc; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#060914"/>
  <ellipse cx="720" cy="24" rx="470" ry="170" fill="#1e3a8a" opacity="0.16"/>
  <ellipse cx="1380" cy="840" rx="280" ry="220" fill="#4c1d95" opacity="0.14"/>

  <g class="font" filter="url(#shadow2)">
